name: "Question or replication problem"
description: "Ask about a script, report a Stata or Python error, or explain a table mismatch."
title: "[PLFS] "
body:
  - type: markdown
    attributes:
      value: >-
        Please read the README first. Do not attach unit-level survey records,
        credentials or identifying information. Use invented examples or aggregate
        results. Questions about the concepts are welcome too.
  - type: dropdown
    id: request_type
    attributes:
      label: "What do you need help with?"
      options:
        - "Understanding a concept"
        - "Setup, paths or data format"
        - "Stata or Python error"
        - "Table does not match the report"
        - "Suggested correction or improvement"
    validations:
      required: true
  - type: dropdown
    id: script
    attributes:
      label: "Which script?"
      options:
        - "PLFS_walkthrough.do (recommended starting point)"
        - "plfs_analysis.py (Python CSV workflow)"
        - "Merging HH and Ind Level data.do (historical)"
        - "Replicating PLFS Report Tables.do (historical)"
        - "oaxaca decomposition.do (exploratory)"
        - "Documentation or not sure"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Stata or Python version and operating system"
      placeholder: "For example: Stata 17 SE, or Python 3.11 with package versions, on Windows 11."
    validations:
      required: true
  - type: textarea
    id: data_release
    attributes:
      label: "Survey release and input format"
      description: "Give the year, source and format, not the actual survey records."
      placeholder: "For example: July 2023-June 2024, MoSPI release, first-visit DTA or CSV files."
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: "Question or steps to reproduce"
      description: "Include the command/error text and whether you ran the whole file or a selection. Remove private path details."
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: "Expected and observed results"
      description: "For table mismatches, give the statement/table number, page, age, sector, gender, usual/CWS status and the values."
  - type: checkboxes
    id: privacy
    attributes:
      label: "Safe to share"
      options:
        - label: "This issue contains no unit-level survey records, respondent identifiers, passwords or access tokens."
          required: true